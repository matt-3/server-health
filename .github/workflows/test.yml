name: test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.11 is the minimum (tomllib); 3.12 is Ubuntu 24.04's.
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python3 -B -m unittest discover -s tests -v
      - run: bash -n install.sh && bash -n tests/install_test.sh
      - run: SERVER_HEALTH_CONFIG=/dev/null python3 -B -m server_health --check-app examples/my-app.toml

  # Installs for real into /usr/local: only on a disposable machine, like the runner.
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo bash tests/install_test.sh

  # The tag is what install.sh downloads: it must report the same version as the package.
  tag_matches_version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test "$(python3 -B -m server_health --version)" = "server-health ${GITHUB_REF_NAME#v}"
